name: CI

on:
  push:
    branches: [ "main", "feature/**", "refactor/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Lint, Syntax & Automated Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ShellCheck & Host Test Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run Syntax Validation (bash -n)
        run: bash tests/test_syntax.sh

      - name: Run ShellCheck Static Analysis
        run: bash tests/test_shellcheck.sh

      - name: Execute Full Automated Test Suite
        run: bash tests/run_tests.sh
